[project]
name = "agent-supervision-tree"
version = "0.1.0"
description = "Erlang/OTP-style supervision trees, bounded mailboxes and hierarchical budget ledgers for failure-prone LLM workers, verified against a reference model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouviere German" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core (every repo) ---
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    # --- agentic kit ---
    "anthropic>=1.0,<2",
]

[project.scripts]
agent-supervision-tree = "agent_supervision_tree.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Baseline metadata consumed by scripts/check_baseline.py.
[tool.portfolio]
kind = "agentic"
package = "agent_supervision_tree"

# pip-audit has no native config file; tasks.py and CI read this list.
# Every entry needs a justification and a review date.
[tool.portfolio.audit]
ignore_vulns = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "bench"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "PT", "PL", "TRY", "BLE", "DTZ", "T20",
]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are fine
    "PLR2004",  # magic numbers in tests and thresholds
    "TRY003",   # messages in exception constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "S603"]
"scripts/**" = ["T201"]
"bench/**" = ["T201", "S311"]
"tasks.py" = ["T201", "S603", "S607"]
"src/agent_supervision_tree/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "bench", "tasks.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
# hypothesis.stateful.run_state_machine_as_test is unannotated upstream; the stateful tests call
# it directly instead of using the implicit TestCase, so the machines have named test functions.
untyped_calls_exclude = ["hypothesis"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
# Imported lazily; type-checked when the SDK is installed (it is, via the agentic kit).
follow_imports = "silent"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated tests with no I/O beyond tmp_path",
    "integration: tests that wire several components (app, files, CLI) together",
]
filterwarnings = ["error::DeprecationWarning:agent_supervision_tree.*"]

[tool.coverage.run]
source = ["agent_supervision_tree"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
